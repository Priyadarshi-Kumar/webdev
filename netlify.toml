[build]
  command = "pnpm nx build web"
  publish = "apps/web/dist/client"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.0"

[[redirects]]
  from = "/portfolio"
  to = "/portfolio/experience"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
